name: Build iDevice Battery

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  APP: idevice_battery

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          pip install pytest
          PYTHONPATH=idevice_battery pytest -q

  consistency:
    name: Version, changelog and tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: App version matches the top changelog section
        run: |
          VERSION="$(sed -n 's/^version: *//p' "${APP}/config.yaml")"
          TOP="$(sed -n 's/^## \([0-9.]*\) — \([0-9-]*\)$/\1 \2/p' "${APP}/CHANGELOG.md" | head -1)"
          echo "config.yaml: ${VERSION} | changelog: ${TOP}"
          if [[ "${TOP%% *}" != "${VERSION}" ]]; then
            echo "top changelog section is '${TOP}', expected '${VERSION} — YYYY-MM-DD'" >&2
            exit 1
          fi

      - name: Only product files are tracked
        run: |
          OUTSIDE="$(git ls-files | grep -Ev '^(idevice_battery|docs|homeassistant|tests|scripts|\.github|\.githooks|\.cursor)/|^(\.gitignore|CHANGELOG\.md|LICENSE|README\.md|repository\.yaml|AGENTS\.md)$' || true)"
          NOISE="$(git ls-files | grep -Ei '(^|/)(secrets\.yaml|\.DS_Store|\._.*)$|\.(db|log|pyc|plist)$|__pycache__|\.pytest_cache' || true)"
          if [[ -n "${OUTSIDE}${NOISE}" ]]; then
            echo "these files must not be in the repository:" >&2
            printf '%s\n%s\n' "${OUTSIDE}" "${NOISE}" | sed '/^$/d' >&2
            exit 1
          fi

  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./${{ env.APP }}

      - name: Normalize app information
        id: normalize
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          VERSION: ${{ steps.info.outputs.version }}
          NAME: ${{ steps.info.outputs.name }}
          DESCRIPTION: ${{ steps.info.outputs.description }}
          URL: ${{ steps.info.outputs.url }}
        run: |
          IMAGE="${IMAGE//\"/}"
          VERSION="${VERSION//\"/}"
          NAME="${NAME//\"/}"
          URL="${URL//\"/}"
          echo "image_name=${IMAGE##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${IMAGE%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "description=${DESCRIPTION}" >> "$GITHUB_OUTPUT"
          if [[ -n "${URL}" && "${URL}" != "null" ]]; then
            echo "url=${URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ env.APP }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
